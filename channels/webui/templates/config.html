<!DOCTYPE html>
<!--
    OpenLumara WebUI - Configuration page

    A simple, standalone page to view and edit configuration from the browser:
    toggle modules on/off, edit each module's settings, and edit the core/api
    settings. Gated behind the same session auth as the rest of the WebUI.

    It reuses the existing helpers (formatLabel, renderMarkdown, the simpleApi*
    fetch wrappers and the THEME_STORE theming), reads config from the redacted
    /api/config/view endpoint, and saves through /api/config/save which drives
    the same ConfigManager write path as /api/settings/save.
-->
{% macro field(container, schemaName, key) %}
<div
    class="cfg-field"
    x-data="{ meta: fieldMeta({{ schemaName }}, {{ key }}), rt: '' }"
    x-init="rt = renderType({{ container }}[{{ key }}], {{ key }}, meta)"
    x-show="(showUnsafe || !meta.unsafe) && dependsOk({{ container }}, meta.depends)"
    x-cloak
>
    <!-- boolean -->
    <template x-if="rt === 'boolean'">
        <div class="cfg-row cfg-row-inline">
            <div class="cfg-label-wrap">
                <label x-text="formatLabel({{ key }})"></label>
                <span class="cfg-desc" x-show="meta.description" x-html="renderDesc(meta.description)"></span>
            </div>
            <button
                type="button"
                class="cfg-toggle"
                :class="{ on: {{ container }}[{{ key }}] }"
                @click="{{ container }}[{{ key }}] = !{{ container }}[{{ key }}]"
            ></button>
        </div>
    </template>

    <!-- secret (redacted) -->
    <template x-if="rt === 'secret'">
        <div class="cfg-row">
            <label x-text="formatLabel({{ key }})"></label>
            <input type="password" autocomplete="off" x-model="{{ container }}[{{ key }}]" />
            <span class="cfg-desc cfg-secret-hint">Hidden for security. Leave as <code>****</code> to keep the current value; type a new value to change it.</span>
            <span class="cfg-desc" x-show="meta.description" x-html="renderDesc(meta.description)"></span>
        </div>
    </template>

    <!-- select -->
    <template x-if="rt === 'select'">
        <div class="cfg-row">
            <label x-text="formatLabel({{ key }})"></label>
            <select x-model="{{ container }}[{{ key }}]">
                <template x-for="[optKey, optLabel] in Object.entries(meta.options || {})" :key="optKey">
                    <option :value="optKey" x-text="optKey"></option>
                </template>
            </select>
            <span class="cfg-desc" x-show="meta.description" x-html="renderDesc(meta.description)"></span>
        </div>
    </template>

    <!-- number -->
    <template x-if="rt === 'number'">
        <div class="cfg-row">
            <label x-text="formatLabel({{ key }})"></label>
            <input
                type="number"
                x-model.number="{{ container }}[{{ key }}]"
                :min="meta.min"
                :max="meta.max"
                :step="meta.step || 1"
            />
            <span class="cfg-desc" x-show="meta.description" x-html="renderDesc(meta.description)"></span>
        </div>
    </template>

    <!-- textarea -->
    <template x-if="rt === 'textarea'">
        <div class="cfg-row">
            <label x-text="formatLabel({{ key }})"></label>
            <textarea rows="4" x-model="{{ container }}[{{ key }}]"></textarea>
            <span class="cfg-desc" x-show="meta.description" x-html="renderDesc(meta.description)"></span>
        </div>
    </template>

    <!-- array / list of strings -->
    <template x-if="rt === 'array'">
        <div class="cfg-row">
            <label x-text="formatLabel({{ key }})"></label>
            <span class="cfg-desc" x-show="meta.description" x-html="renderDesc(meta.description)"></span>
            <div class="cfg-list">
                <template x-for="(item, i) in ({{ container }}[{{ key }}] || [])" :key="i">
                    <div class="cfg-list-item">
                        <input
                            type="text"
                            :value="item"
                            @input="{{ container }}[{{ key }}] = {{ container }}[{{ key }}].map((v, idx) => (idx === i ? $event.target.value : v))"
                        />
                        <button
                            type="button"
                            class="cfg-mini-btn"
                            @click="{{ container }}[{{ key }}] = {{ container }}[{{ key }}].filter((_, idx) => idx !== i)"
                            title="Remove"
                        >&times;</button>
                    </div>
                </template>
                <div class="cfg-list-add" x-data="{ nv: '' }">
                    <input type="text" placeholder="Add item..." x-model="nv" />
                    <button
                        type="button"
                        class="cfg-mini-btn"
                        @click="if (nv.trim()) { {{ container }}[{{ key }}] = [...({{ container }}[{{ key }}] || []), nv.trim()]; nv = ''; }"
                    >+</button>
                </div>
            </div>
        </div>
    </template>

    <!-- object / key-value map -->
    <template x-if="rt === 'object'">
        <div class="cfg-row">
            <label x-text="formatLabel({{ key }})"></label>
            <span class="cfg-desc" x-show="meta.description" x-html="renderDesc(meta.description)"></span>
            <div class="cfg-list">
                <template x-for="(entry, i) in Object.entries({{ container }}[{{ key }}] || {})" :key="i">
                    <div class="cfg-list-item">
                        <input
                            type="text"
                            :value="entry[0]"
                            placeholder="Key"
                            @input="{{ container }}[{{ key }}] = Object.fromEntries(Object.entries({{ container }}[{{ key }}] || {}).map(([k, v], idx) => (idx === i ? [$event.target.value, v] : [k, v])))"
                        />
                        <input
                            type="text"
                            :value="entry[1]"
                            placeholder="Value"
                            @input="{{ container }}[{{ key }}] = Object.fromEntries(Object.entries({{ container }}[{{ key }}] || {}).map(([k, v], idx) => (idx === i ? [k, $event.target.value] : [k, v])))"
                        />
                        <button
                            type="button"
                            class="cfg-mini-btn"
                            @click="{{ container }}[{{ key }}] = Object.fromEntries(Object.entries({{ container }}[{{ key }}] || {}).filter((_, idx) => idx !== i))"
                            title="Remove"
                        >&times;</button>
                    </div>
                </template>
                <div class="cfg-list-add" x-data="{ nk: '', nvv: '' }">
                    <input type="text" placeholder="Key" x-model="nk" />
                    <input type="text" placeholder="Value" x-model="nvv" />
                    <button
                        type="button"
                        class="cfg-mini-btn"
                        @click="if (nk.trim()) { {{ container }}[{{ key }}] = { ...({{ container }}[{{ key }}] || {}), [nk.trim()]: nvv }; nk = ''; nvv = ''; }"
                    >+</button>
                </div>
            </div>
        </div>
    </template>

    <!-- text (default) -->
    <template x-if="rt === 'text'">
        <div class="cfg-row">
            <label x-text="formatLabel({{ key }})"></label>
            <input type="text" x-model="{{ container }}[{{ key }}]" />
            <span class="cfg-desc" x-show="meta.description" x-html="renderDesc(meta.description)"></span>
        </div>
    </template>
</div>
{% endmacro %}
<html>
    <head>
        <title>Configuration - {{ config.get('title') }}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- libraries (same set the SPA uses) -->
        <script src="{{ url_for('assets', path='js/libs/purify.min.js') }}"></script>
        <script src="{{ url_for('assets', path='js/libs/marked.min.js') }}"></script>
        <script src="{{ url_for('assets', path='js/libs/alpine.min.js') }}" defer></script>

        <!-- theme + shared stylesheets (theme variables are applied by THEME_STORE at runtime) -->
        {% for file in css_files %}
        <link rel="stylesheet" href="{{ url_for('assets', path='css/'+file) }}" />
        {% endfor %}
        <link rel="stylesheet" id="code-theme" href="{{ url_for('assets', path='css/code-themes/github-dark.css') }}" />

        <style>
            [x-cloak] {
                display: none !important;
            }

            .config-page {
                min-height: 100vh;
                background: var(--bg-primary, #0a0a0a);
                color: var(--text-primary, #fafafa);
                font-family: var(--font-primary, sans-serif);
                font-size: var(--font-size-base, 15px);
                padding: 0 0 120px;
                box-sizing: border-box;
            }

            .config-page * {
                box-sizing: border-box;
            }

            .cfg-topbar {
                position: sticky;
                top: 0;
                z-index: 10;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 14px 22px;
                background: var(--bg-secondary, #111);
                border-bottom: 1px solid var(--border-color, #262626);
            }

            .cfg-topbar h1 {
                margin: 0;
                font-size: 1.15rem;
                font-weight: 600;
            }

            .cfg-topbar .cfg-top-actions {
                display: flex;
                align-items: center;
                gap: 14px;
            }

            .cfg-back {
                color: var(--text-secondary, #a1a1aa);
                text-decoration: none;
                font-size: 0.9rem;
                padding: 6px 12px;
                border: 1px solid var(--border-color, #262626);
                border-radius: var(--radius-sm, 6px);
            }

            .cfg-back:hover {
                color: var(--text-primary, #fff);
                background: var(--bg-tertiary, #1a1a1a);
            }

            .cfg-unsafe-check {
                display: flex;
                align-items: center;
                gap: 7px;
                font-size: 0.85rem;
                color: var(--text-secondary, #a1a1aa);
                cursor: pointer;
                user-select: none;
            }

            .cfg-content {
                max-width: 860px;
                margin: 0 auto;
                padding: 24px 22px;
            }

            .cfg-group {
                margin-bottom: 30px;
                background: var(--bg-secondary, #111);
                border: 1px solid var(--border-color, #262626);
                border-radius: var(--radius-md, 10px);
                overflow: hidden;
            }

            .cfg-group > h2 {
                margin: 0;
                padding: 14px 18px;
                font-size: 1rem;
                font-weight: 600;
                background: var(--bg-tertiary, #1a1a1a);
                border-bottom: 1px solid var(--border-color, #262626);
            }

            .cfg-group-body {
                padding: 6px 18px 14px;
            }

            .cfg-field {
                padding: 12px 0;
                border-bottom: 1px solid var(--border-color, #1e1e24);
            }

            .cfg-field:last-child {
                border-bottom: none;
            }

            .cfg-row {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .cfg-row-inline {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 14px;
            }

            .cfg-label-wrap {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .cfg-field label {
                font-size: 0.92rem;
                font-weight: 500;
            }

            .cfg-desc {
                font-size: 0.8rem;
                color: var(--text-secondary, #a1a1aa);
                line-height: 1.4;
            }

            .cfg-desc code {
                background: var(--bg-code, #0a0a0a);
                padding: 1px 5px;
                border-radius: 4px;
                font-family: var(--code-font, monospace);
            }

            .cfg-secret-hint {
                color: var(--important, #eab308);
            }

            .cfg-field input[type="text"],
            .cfg-field input[type="number"],
            .cfg-field input[type="password"],
            .cfg-field select,
            .cfg-field textarea {
                width: 100%;
                padding: 8px 10px;
                background: var(--bg-input, #0f0f12);
                color: var(--text-primary, #fafafa);
                border: 1px solid var(--border-color, #262626);
                border-radius: var(--radius-sm, 6px);
                font-family: inherit;
                font-size: 0.9rem;
            }

            .cfg-field textarea {
                resize: vertical;
            }

            .cfg-field input:focus,
            .cfg-field select:focus,
            .cfg-field textarea:focus {
                outline: none;
                border-color: var(--accent, #fff);
            }

            .cfg-list {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .cfg-list-item,
            .cfg-list-add {
                display: flex;
                gap: 6px;
            }

            .cfg-mini-btn {
                flex: 0 0 auto;
                min-width: 34px;
                padding: 6px 10px;
                background: var(--button-bg, #1a1a1a);
                color: var(--button-text, #fafafa);
                border: 1px solid var(--border-color, #262626);
                border-radius: var(--radius-sm, 6px);
                cursor: pointer;
                font-size: 1rem;
                line-height: 1;
            }

            .cfg-mini-btn:hover {
                background: var(--button-hover, #262626);
            }

            /* toggle switch */
            .cfg-toggle {
                position: relative;
                flex: 0 0 auto;
                width: 44px;
                height: 24px;
                border-radius: var(--radius-full, 9999px);
                background: var(--bg-tertiary, #333);
                border: 1px solid var(--border-color, #262626);
                cursor: pointer;
                transition: background 0.15s;
            }

            .cfg-toggle::after {
                content: "";
                position: absolute;
                top: 2px;
                left: 2px;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: var(--text-secondary, #a1a1aa);
                transition: transform 0.15s, background 0.15s;
            }

            .cfg-toggle.on {
                background: var(--accent, #fff);
            }

            .cfg-toggle.on::after {
                transform: translateX(20px);
                background: var(--bg-primary, #0a0a0a);
            }

            /* module cards */
            .cfg-module {
                border-bottom: 1px solid var(--border-color, #1e1e24);
                padding: 12px 0;
            }

            .cfg-module:last-child {
                border-bottom: none;
            }

            .cfg-module.disabled .cfg-module-name {
                color: var(--text-muted, #52525b);
            }

            .cfg-module.unsafe {
                border-left: 3px solid var(--important, #eab308);
                padding-left: 12px;
            }

            .cfg-module-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 14px;
            }

            .cfg-module-title {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .cfg-expander {
                background: none;
                border: none;
                color: var(--text-secondary, #a1a1aa);
                cursor: pointer;
                font-size: 0.9rem;
                padding: 2px 4px;
            }

            .cfg-module-name {
                font-weight: 600;
                font-size: 0.95rem;
            }

            .cfg-unsafe-badge {
                font-size: 0.72rem;
                font-weight: 600;
                color: var(--important, #eab308);
                background: var(--important-bg, rgba(234, 179, 8, 0.12));
                border: 1px solid var(--important-border, #33331a);
                padding: 1px 7px;
                border-radius: var(--radius-full, 9999px);
            }

            .cfg-module-desc {
                margin: 6px 0 0 32px;
                font-size: 0.8rem;
                color: var(--text-secondary, #a1a1aa);
            }

            .cfg-module-body {
                margin: 10px 0 0 32px;
                padding-left: 12px;
                border-left: 1px solid var(--border-color, #1e1e24);
            }

            .cfg-no-settings {
                font-size: 0.82rem;
                color: var(--text-muted, #52525b);
                font-style: italic;
            }

            /* footer save bar */
            .cfg-footer {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 16px;
                padding: 14px 22px;
                background: var(--bg-secondary, #111);
                border-top: 1px solid var(--border-color, #262626);
                z-index: 10;
            }

            .cfg-msg {
                margin-right: auto;
                font-size: 0.88rem;
            }

            .cfg-msg.success {
                color: var(--info, #93c5fd);
            }

            .cfg-msg.error {
                color: var(--error, #fca5a5);
            }

            .cfg-save {
                padding: 9px 22px;
                background: var(--accent, #fff);
                color: var(--bg-primary, #0a0a0a);
                border: none;
                border-radius: var(--radius-sm, 6px);
                font-weight: 600;
                font-size: 0.9rem;
                cursor: pointer;
            }

            .cfg-save:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .cfg-state {
                max-width: 860px;
                margin: 60px auto;
                text-align: center;
                color: var(--text-secondary, #a1a1aa);
            }

            .cfg-state.error {
                color: var(--error, #fca5a5);
            }
        </style>
    </head>
    <body>
        <div class="config-page" x-data="configPage()" x-init="init()">
            <div class="cfg-topbar">
                <h1>Configuration</h1>
                <div class="cfg-top-actions">
                    <label class="cfg-unsafe-check">
                        <input type="checkbox" x-model="showUnsafe" />
                        Show unsafe settings
                    </label>
                    <a class="cfg-back" href="/">&larr; Back to chat</a>
                </div>
            </div>

            <!-- loading -->
            <template x-if="loading">
                <div class="cfg-state">Loading configuration...</div>
            </template>

            <!-- load error -->
            <template x-if="!loading && error && !ready">
                <div class="cfg-state error" x-text="'Failed to load configuration: ' + error"></div>
            </template>

            <!-- content -->
            <template x-if="ready">
                <div class="cfg-content">
                    <!-- core config sections -->
                    <template x-for="section in coreSections()" :key="section">
                        <section class="cfg-group">
                            <h2 x-text="formatLabel(section)"></h2>
                            <div class="cfg-group-body">
                                <template x-for="key in Object.keys(config[section] || {})" :key="section + '.' + key">
                                    {{ field("config[section]", "section", "key") }}
                                </template>
                            </div>
                        </section>
                    </template>

                    <!-- module / channel categories -->
                    <template x-for="cat in moduleCategories()" :key="cat">
                        <section class="cfg-group">
                            <h2 x-text="formatLabel(cat)"></h2>
                            <div class="cfg-group-body">
                                <template x-for="name in itemsFor(cat)" :key="cat + '.' + name">
                                    <template x-if="showUnsafe || !isUnsafe(name)">
                                        <div
                                            class="cfg-module"
                                            :class="{ disabled: !isEnabled(cat, name), unsafe: isUnsafe(name) }"
                                            x-data="{ open: false }"
                                        >
                                            <div class="cfg-module-head">
                                                <div class="cfg-module-title">
                                                    <button type="button" class="cfg-expander" @click="open = !open" x-text="open ? '▾' : '▸'"></button>
                                                    <span class="cfg-module-name" x-text="formatLabel(name)"></span>
                                                    <span class="cfg-unsafe-badge" x-show="isUnsafe(name)" title="This module is marked unsafe - enable at your own risk">&#9888; unsafe</span>
                                                </div>
                                                <button
                                                    type="button"
                                                    class="cfg-toggle"
                                                    :class="{ on: isEnabled(cat, name) }"
                                                    @click="toggle(cat, name)"
                                                    :title="isEnabled(cat, name) ? 'Enabled - click to disable' : 'Disabled - click to enable'"
                                                ></button>
                                            </div>

                                            <p class="cfg-module-desc" x-show="moduleDesc(name)" x-html="renderDesc(moduleDesc(name))"></p>

                                            <div class="cfg-module-body" x-show="open" x-cloak>
                                                <template x-if="moduleSettings(cat, name)">
                                                    <div>
                                                        <template x-for="key in Object.keys(moduleSettings(cat, name))" :key="cat + '.' + name + '.' + key">
                                                            {{ field("config[cat].settings[name]", "name", "key") }}
                                                        </template>
                                                    </div>
                                                </template>
                                                <template x-if="!moduleSettings(cat, name)">
                                                    <p class="cfg-no-settings">This module has no configurable settings.</p>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                            </div>
                        </section>
                    </template>
                </div>
            </template>

            <!-- save bar -->
            <template x-if="ready">
                <div class="cfg-footer">
                    <span class="cfg-msg" :class="messageType" x-text="message" x-show="message"></span>
                    <button class="cfg-save" @click="save()" :disabled="saving" x-text="saving ? 'Saving...' : 'Save changes'"></button>
                </div>
            </template>
        </div>

        <!-- reused helpers -->
        <script src="{{ url_for('assets', path='js/utils/format.js') }}"></script>
        <script src="{{ url_for('assets', path='js/renderers/markdown.js') }}"></script>
        <script src="{{ url_for('assets', path='js/services/api.js') }}"></script>
        <script src="{{ url_for('assets', path='js/stores/theming.js') }}"></script>

        <script>
            marked.setOptions({ breaks: true, gfm: true });

            // apply the saved theme so the page matches the rest of the WebUI
            document.addEventListener("DOMContentLoaded", () => {
                try {
                    THEME_STORE.init();
                } catch (e) {
                    console.warn("theme init failed", e);
                }
            });

            // sanitize + render short markdown descriptions (no code-copy directive,
            // no highlight dependency - just safe inline HTML)
            function renderDesc(text) {
                if (!text) return "";
                return DOMPurify.sanitize(marked.parseInline(String(text)));
            }

            const SENSITIVE_KEYWORDS = ["token", "key", "secret", "password", "auth", "credential"];
            const REDACTED_PLACEHOLDER = "****";
            const MODULE_CATEGORIES = ["modules", "user_modules", "channels", "user_channels"];
            const CORE_SECTIONS = ["core", "api", "model"];

            function configPage() {
                return {
                    loading: true,
                    ready: false,
                    saving: false,
                    error: null,
                    message: "",
                    messageType: "success",
                    config: {},
                    original: {},
                    schema: {},
                    showUnsafe: false,

                    async init() {
                        try {
                            this.config = await simpleApiFetch("/api/config/view");
                            try {
                                this.schema = await simpleApiFetch("/api/settings/get_module_info");
                            } catch (schemaErr) {
                                console.warn("failed to load schema", schemaErr);
                                this.schema = {};
                            }
                            this.original = JSON.parse(JSON.stringify(this.config));
                            this.showUnsafe = !!(
                                this.config.channels &&
                                this.config.channels.settings &&
                                this.config.channels.settings.webui &&
                                this.config.channels.settings.webui.show_unsafe_settings
                            );
                            this.ready = true;
                        } catch (err) {
                            this.error = typeof err === "string" ? err : err.message || "unknown error";
                        } finally {
                            this.loading = false;
                        }
                    },

                    // --- section helpers ---
                    coreSections() {
                        return CORE_SECTIONS.filter((s) => this.config[s] && typeof this.config[s] === "object");
                    },
                    moduleCategories() {
                        return MODULE_CATEGORIES.filter((c) => this.config[c] && Array.isArray(this.config[c].enabled));
                    },
                    itemsFor(cat) {
                        const c = this.config[cat] || {};
                        return [...(c.enabled || []), ...(c.disabled || [])];
                    },

                    // --- module helpers ---
                    isEnabled(cat, name) {
                        return (this.config[cat].enabled || []).includes(name);
                    },
                    isUnsafe(name) {
                        return !!(this.schema[name] && this.schema[name].unsafe);
                    },
                    moduleDesc(name) {
                        return (this.schema[name] && this.schema[name].description) || "";
                    },
                    moduleSettings(cat, name) {
                        const s = this.config[cat] && this.config[cat].settings;
                        const v = s && s[name];
                        return v && typeof v === "object" && Object.keys(v).length ? v : null;
                    },
                    toggle(cat, name) {
                        const c = this.config[cat];
                        if (c.enabled.includes(name)) {
                            c.enabled = c.enabled.filter((x) => x !== name);
                            c.disabled = [...c.disabled, name].sort();
                        } else {
                            c.disabled = c.disabled.filter((x) => x !== name);
                            c.enabled = [...c.enabled, name].sort();
                        }
                    },

                    // --- field schema / type resolution ---
                    fieldMeta(schemaName, key) {
                        const entry = this.schema[schemaName] || {};
                        const fs = (entry.settings_schema && entry.settings_schema[key]) || {};
                        return {
                            type: fs.type || null,
                            description: fs.description || null,
                            unsafe: !!fs.unsafe,
                            options: fs.options || null,
                            depends: fs.depends || null,
                            min: fs.min,
                            max: fs.max,
                            step: fs.step,
                        };
                    },
                    fieldType(value, meta) {
                        if (meta && meta.type) {
                            if (meta.type === "long_text") return "textarea";
                            return meta.type;
                        }
                        if (typeof value === "boolean") return "boolean";
                        if (typeof value === "number") return "number";
                        if (Array.isArray(value)) return "array";
                        if (value !== null && typeof value === "object") return "object";
                        if (typeof value === "string" && value.includes("\n")) return "textarea";
                        return "text";
                    },
                    isSecret(key, value) {
                        const k = String(key).toLowerCase();
                        if (SENSITIVE_KEYWORDS.some((kw) => k.includes(kw))) return true;
                        return value === REDACTED_PLACEHOLDER;
                    },
                    renderType(value, key, meta) {
                        const t = this.fieldType(value, meta);
                        if ((t === "text" || t === "textarea") && this.isSecret(key, value)) return "secret";
                        return t;
                    },
                    dependsOk(container, depends) {
                        if (!depends) return true;
                        if (typeof depends === "string") return !!(container && container[depends]);
                        if (typeof depends === "object") {
                            return Object.entries(depends).every(([k, v]) => container && container[k] === v);
                        }
                        return true;
                    },

                    // --- save ---
                    computeChangedModules() {
                        const changed = [];
                        for (const cat of MODULE_CATEGORIES) {
                            const now = (this.config[cat] && this.config[cat].settings) || {};
                            const orig = (this.original[cat] && this.original[cat].settings) || {};
                            for (const name of Object.keys(now)) {
                                if (JSON.stringify(now[name]) !== JSON.stringify(orig[name])) {
                                    changed.push(name);
                                }
                            }
                        }
                        return changed;
                    },
                    enabledListsChanged() {
                        for (const cat of MODULE_CATEGORIES) {
                            const now = this.config[cat] && this.config[cat].enabled;
                            const orig = this.original[cat] && this.original[cat].enabled;
                            if (JSON.stringify(now) !== JSON.stringify(orig)) return true;
                        }
                        return false;
                    },
                    async save() {
                        this.saving = true;
                        this.message = "";
                        try {
                            const payload = JSON.parse(JSON.stringify(this.config));
                            payload.changed_modules = this.computeChangedModules();

                            const needsRestart = this.enabledListsChanged();

                            await simpleApiPost("/api/config/save", payload);

                            this.original = JSON.parse(JSON.stringify(this.config));

                            if (needsRestart) {
                                this.messageType = "success";
                                this.message = "Saved. Restarting the server to apply enabled/disabled changes...";
                                try {
                                    await simpleApiPost("/api/system/restart", {});
                                } catch (restartErr) {
                                    // the server is going down, so the request often never resolves cleanly
                                    console.debug("restart request ended", restartErr);
                                }
                                setTimeout(() => window.location.reload(), 3500);
                            } else {
                                this.messageType = "success";
                                this.message = "Settings saved.";
                            }
                        } catch (err) {
                            this.messageType = "error";
                            this.message = "Save failed: " + (typeof err === "string" ? err : err.message || "unknown error");
                        } finally {
                            this.saving = false;
                        }
                    },
                };
            }
        </script>
    </body>
</html>
